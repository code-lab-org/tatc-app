[build-system]
requires = [
    "setuptools >= 57.0.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "tatc-app"
description = "TAT-C Application"
authors = [
    {name = "Paul T. Grogan", email = "paul.grogan@asu.edu"}
]
readme = "README.md"
requires-python = ">=3.11, <3.15"
license = {text = "BSD License"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta"
]
dependencies = [
    "aiohttp",
    # authlib.jose (used to validate ID tokens) is removed in authlib 2
    "authlib >= 1.3, < 2",
    "celery[redis] >= 5.7",
    "fastapi >= 0.110.0",
    "geojson-pydantic",
    # also installed by tatc, but imported directly
    "geopandas",
    # used, but not required, by authlib's Starlette client (sign in)
    "httpx",
    # used, but not required, by Starlette's SessionMiddleware
    "itsdangerous",
    "msgpack-asgi >= 2",
    # also installed by tatc, but imported directly
    "numpy",
    "pandas",
    "pyproj",
    "python-dotenv",
    "shapely",
    "tatc >= 3.8.0, < 3.9",
    "uvicorn[standard]"
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/code-lab-org/tatc-app"
Issues = "https://github.com/code-lab-org/tatc-app/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tatc_app = ["resources/*.zip", "static/*"]

[project.optional-dependencies]
dev = [
    "black >= 24.2",
    "isort",
    "pylint",
    "pylint-pydantic",
    "pytest",
    "pytest-cov >= 6.1",
    "pytest-xdist"
]
# browser tests (tests/browser, run with TATC_BROWSER_TESTS=1), after
# `playwright install chromium`
browser = [
    "playwright"
]
docs = [
    "autodoc_pydantic >= 2",
    "myst-parser",
    "sphinx >= 7, < 9",
    "sphinx-rtd-theme"
]

[tool.setuptools.dynamic]
version = {attr = "tatc_app.__version__"}

[tool.isort]
profile = "black"

# coverage of tests (`pytest --cov=tatc_app`): modules not fully covered
[tool.coverage.report]
show_missing = true
skip_covered = true
