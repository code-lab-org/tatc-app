name: Tests

# Runs on pull requests, and before images are built and pushed (see
# ghcr-push-image.yml, which calls this workflow), so code that fails its
# tests is never deployed.
on:
  pull_request:
    branches: [ "main" ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the Python version of the Docker images
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the application and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check the code style
        run: |
          black --check .
          isort --check-only .

      # tasks run eagerly, without a broker, backend, or worker (see
      # tests/conftest.py), in a process per CPU, with the coverage of the
      # code in the log and the job summary
      - name: Run the tests
        run: >-
          pytest -n auto --cov=tatc_app --cov-report=term
          --cov-report="markdown-append:$GITHUB_STEP_SUMMARY"

  # drives the web app in a browser (see tests/browser/conftest.py)
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the application and browser test dependencies
        run: python -m pip install -e ".[dev,browser]"

      - name: Install the browser
        run: python -m playwright install --with-deps chromium

      - name: Run the browser tests
        env:
          TATC_BROWSER_TESTS: "1"
        # in one process: each process runs a server and a browser that draws
        # the globe in software, so the runner's few CPUs are busy with one,
        # and more processes time out without finishing sooner
        run: pytest tests/browser
