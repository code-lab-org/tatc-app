# rabbitmq.conf
#
# RabbitMQ is only accessible on the internal Docker network.
# TLS is terminated by Traefik, so RabbitMQ itself listens for
# ordinary AMQP on port 5672.

listeners.tcp.default = 5672

# Keep the built-in guest account restricted to localhost.
# This is RabbitMQ's default, but making it explicit documents
# the desired security policy.
loopback_users.guest = true

deprecated_features.permit.transient_nonexcl_queues = true
deprecated_features.permit.global_qos = true
