# Dex (OpenID Connect provider) configuration for the TAT-C server
# deployment (`compose.server.yml`). See https://dexidp.io/docs/.
#
# Deployment-specific values are set in the `.env` file (see README.md):
#  * `{{ getenv "NAME" }}` inserts an environment variable when the Dex container
#    starts (the Dex image renders this file with gomplate);
#  * secrets are read by Dex itself: `secretEnv` (clients), `hashFromEnv`
#    (passwords), and `$NAME` (only within the `connectors` section).

# Public URL of Dex, routed by Traefik under the server's domain.
issuer: https://{{ getenv "TATC_DOMAIN" }}/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

frontend:
  issuer: TAT-C

oauth2:
  skipApprovalScreen: true

expiry:
  # lifetime of ID tokens (also usable as bearer tokens by API clients)
  idTokens: 8h

# The TAT-C server application.
staticClients:
  - id: tatc-app
    name: TAT-C
    secretEnv: TATC_OIDC_CLIENT_SECRET
    redirectURIs:
      - https://{{ getenv "TATC_DOMAIN" }}/auth/callback

# Users defined in this file (sign in with email and password).
enablePasswordDB: true
staticPasswords:
  - email: {{ getenv "TATC_ADMIN_EMAIL" }}
    # environment variable with the bcrypt hash of the password (see README.md)
    hashFromEnv: TATC_ADMIN_PASSWORD_HASH
    username: admin
    userID: tatc-admin

# Users of GitHub. Requires a GitHub OAuth app with the authorization callback
# URL https://<TATC_DOMAIN>/dex/callback. Remove this connector if not used.
connectors:
  - type: github
    id: github
    name: GitHub
    config:
      clientID: $GITHUB_CLIENT_ID
      clientSecret: $GITHUB_CLIENT_SECRET
      redirectURI: https://{{ getenv "TATC_DOMAIN" }}/dex/callback
      # Optionally, restrict sign in to members of GitHub organizations:
      # orgs:
      #   - name: code-lab-org
